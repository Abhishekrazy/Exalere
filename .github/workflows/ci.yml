name: Exalere CI & PR Analysis

on:
  push:
    branches:
      - main
      - staging
      - develop
  pull_request:
    branches:
      - main
      - staging
      - develop

jobs:
  analyze_and_test:
    name: Flutter Analyze & Code Verification
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8' # pinned to the version the repo is formatted with
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Project Code
        run: flutter analyze

      # A workflow file is code: a broken one fails silently (it simply never
      # runs), which is how the provider monitor stayed dead for a day.
      - name: Validate workflow files
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for path in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  yaml.safe_load(open(path, encoding='utf-8'))
                  print(f'ok {path}')
              except Exception as error:
                  bad += 1
                  print(f'INVALID {path}: {error}')
          sys.exit(1 if bad else 0)
          PY

      - name: Run Unit & Widget Tests
        run: flutter test
