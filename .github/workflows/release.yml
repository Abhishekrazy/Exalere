name: Release & Build Distribution

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'SemVer release type (patch: 0.1.1, minor: 0.2.0, major: 1.0.0, none: keep current)'
        required: true
        default: 'patch'
        type: choice
        options:
          - 'patch'
          - 'minor'
          - 'major'
          - 'none'
      custom_version:
        description: 'Explicit version string (e.g. 0.1.0 or 0.2.0-beta.1). Overrides bump_type if specified.'
        required: false
        default: ''
        type: string
      target_platform:
        description: 'Select platform to build (supports single platform hotfix)'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'android'
          - 'tv'
          - 'windows'
      release_notes:
        description: 'Custom release notes / change description'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  verify_code:
    name: Verify Formatting, Analysis & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Project Code
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test

  version_bump:
    name: Calculate Target Release Version
    needs: verify_code
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version_step.outputs.NEW_VERSION }}
      version_name: ${{ steps.version_step.outputs.VERSION_NAME }}
      build_number: ${{ steps.version_step.outputs.BUILD_NUMBER }}
      tag_name: ${{ steps.version_step.outputs.TAG_NAME }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Calculate Release Version
        id: version_step
        run: |
          # Read current version from pubspec.yaml (e.g. 0.1.0+1)
          CURRENT_VERSION_LINE=$(grep "^version: " pubspec.yaml)
          RAW_VERSION=$(echo "$CURRENT_VERSION_LINE" | sed 's/version: //')
          NAME_PART=$(echo "$RAW_VERSION" | cut -d'+' -f1)
          BUILD_NUM=$(echo "$RAW_VERSION" | cut -d'+' -f2)

          IFS='.' read -r MAJOR MINOR PATCH <<< "$NAME_PART"

          CUSTOM="${{ github.event.inputs.custom_version }}"
          if [ -n "$CUSTOM" ]; then
            # Strip leading 'v' if user typed v0.1.0
            CUSTOM=$(echo "$CUSTOM" | sed 's/^v//')
            NAME_PART="$CUSTOM"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$NAME_PART"
            if [ -z "$BUILD_NUM" ]; then
              BUILD_NUM=1
            fi
            NEW_VERSION="${NAME_PART}+${BUILD_NUM}"
            TAG="v${NAME_PART}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # Direct tag push (e.g. v0.3.1)
            RAW_TAG="${{ github.ref_name }}"
            NAME_PART=$(echo "$RAW_TAG" | sed 's/^v//')
            IFS='.' read -r MAJOR MINOR PATCH <<< "$NAME_PART"
            if [ -z "$BUILD_NUM" ]; then
              BUILD_NUM=1
            fi
            NEW_VERSION="${NAME_PART}+${BUILD_NUM}"
            TAG="$RAW_TAG"
          else
            BUMP="${{ github.event.inputs.bump_type }}"
            if [ -z "$BUMP" ]; then
              BUMP="patch"
            fi

            if [ "$BUMP" = "major" ]; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              BUILD_NUM=$((BUILD_NUM + 1))
            elif [ "$BUMP" = "minor" ]; then
              MINOR=$((MINOR + 1))
              PATCH=0
              BUILD_NUM=$((BUILD_NUM + 1))
            elif [ "$BUMP" = "patch" ]; then
              PATCH=$((PATCH + 1))
              BUILD_NUM=$((BUILD_NUM + 1))
            fi

            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}+${BUILD_NUM}"
            TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"

          echo "Target Release: $NEW_VERSION (Tag: $TAG, Version: $VERSION_NAME, Build: $BUILD_NUM)"

          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUM" >> $GITHUB_OUTPUT
          echo "TAG_NAME=${TAG}" >> $GITHUB_OUTPUT

  build_android:
    name: Build Android APKs (Mobile & TV)
    needs: [verify_code, version_bump]
    if: "${{ github.event.inputs.target_platform == 'all' || github.event.inputs.target_platform == 'android' || github.event.inputs.target_platform == 'tv' || github.event_name == 'push' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Android Release Signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Decoding repository release keystore from secrets..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD" > android/key.properties
            echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=${ANDROID_KEY_ALIAS:-exalere}" >> android/key.properties
            echo "storeFile=upload-keystore.jks" >> android/key.properties
          else
            echo "Generating release keystore for CI build..."
            keytool -genkeypair -v -keystore android/app/upload-keystore.jks \
              -storetype PKCS12 -keyalg RSA -keysize 2048 -validity 10000 \
              -alias exalere -storepass exalere_ci_release -keypass exalere_ci_release \
              -dname "CN=Abhishek Razy, OU=Mobile & TV Development, O=abhishekrazy.com, L=Chandigarh, ST=Chandigarh, C=IN"
            echo "storePassword=exalere_ci_release" > android/key.properties
            echo "keyPassword=exalere_ci_release" >> android/key.properties
            echo "keyAlias=exalere" >> android/key.properties
            echo "storeFile=upload-keystore.jks" >> android/key.properties
          fi

      - name: Build Optimized Split APKs (~26-31 MB)
        run: |
          VERSION="${{ needs.version_bump.outputs.version_name }}"
          flutter build apk --release --split-per-abi \
            --build-name="$VERSION" \
            --build-number="${{ needs.version_bump.outputs.build_number }}" \
            --dart-define=TMDB_API_KEY="${{ secrets.TMDB_API_KEY }}" \
            --dart-define=TMDB_READ_TOKEN="${{ secrets.TMDB_READ_TOKEN }}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Exalere-Android-arm64-v8a-$VERSION.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk Exalere-Android-armeabi-v7a-$VERSION.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk Exalere-Android-x86_64-$VERSION.apk

      - name: Build Universal Fallback APK
        run: |
          VERSION="${{ needs.version_bump.outputs.version_name }}"
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="${{ needs.version_bump.outputs.build_number }}" \
            --dart-define=TMDB_API_KEY="${{ secrets.TMDB_API_KEY }}" \
            --dart-define=TMDB_READ_TOKEN="${{ secrets.TMDB_READ_TOKEN }}"
          cp build/app/outputs/flutter-apk/app-release.apk Exalere-Android-Universal-$VERSION.apk

      - name: Upload Android Release Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-release-apks
          path: |
            Exalere-Android-arm64-v8a-${{ needs.version_bump.outputs.version_name }}.apk
            Exalere-Android-armeabi-v7a-${{ needs.version_bump.outputs.version_name }}.apk
            Exalere-Android-x86_64-${{ needs.version_bump.outputs.version_name }}.apk
            Exalere-Android-Universal-${{ needs.version_bump.outputs.version_name }}.apk

  build_windows:
    name: Build Windows Desktop (x64)
    needs: [verify_code, version_bump]
    if: "${{ github.event.inputs.target_platform == 'all' || github.event.inputs.target_platform == 'windows' || github.event_name == 'push' }}"
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Desktop Release
        run: |
          flutter build windows --release `
            --build-name="${{ needs.version_bump.outputs.version_name }}" `
            --build-number="${{ needs.version_bump.outputs.build_number }}" `
            --dart-define=TMDB_API_KEY="${{ secrets.TMDB_API_KEY }}" `
            --dart-define=TMDB_READ_TOKEN="${{ secrets.TMDB_READ_TOKEN }}"

      - name: Sign Windows Executable (Authenticode)
        shell: pwsh
        run: |
          $winExe = ""
          if (Test-Path "build\windows\x64\runner\Release\exalere.exe") {
            $winExe = "build\windows\x64\runner\Release\exalere.exe"
          } elseif (Test-Path "build\windows\runner\Release\exalere.exe") {
            $winExe = "build\windows\runner\Release\exalere.exe"
          }
          .\scripts\sign_windows.ps1 -TargetPath $winExe

      - name: Package Windows Portable Zip
        shell: pwsh
        run: |
          $ver = "${{ needs.version_bump.outputs.version_name }}"
          $winRelease = ""
          if (Test-Path "build\windows\x64\runner\Release") {
            $winRelease = "build\windows\x64\runner\Release"
          } elseif (Test-Path "build\windows\runner\Release") {
            $winRelease = "build\windows\runner\Release"
          } else {
            $match = Get-ChildItem -Path "build\windows" -Filter "Release" -Recurse -Directory | Select-Object -First 1
            if ($match) { $winRelease = $match.FullName }
          }
          Write-Host "Packaging Windows release from: $winRelease"
          Compress-Archive -Path "$winRelease\*" -DestinationPath "Exalere-Windows-Portable-x64-$ver.zip" -Force

          # Normalize path so Inno Setup script (..\build\windows\runner\Release) always finds files
          if ($winRelease -and !(Test-Path "build\windows\runner\Release")) {
            New-Item -ItemType Directory -Path "build\windows\runner" -Force | Out-Null
            Copy-Item -Path "$winRelease" -Destination "build\windows\runner\Release" -Recurse -Force
          }

      - name: Update Installer Script Version
        shell: pwsh
        run: |
          (Get-Content windows/installer/exalere_setup.iss) -replace '#define MyAppVersion ".*"', '#define MyAppVersion "${{ needs.version_bump.outputs.version_name }}"' | Set-Content windows/installer/exalere_setup.iss

      - name: Compile Windows Setup Installer (Inno Setup)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: windows/installer/exalere_setup.iss

      - name: Prepare Windows Release Artifacts
        shell: pwsh
        run: |
          $ver = "${{ needs.version_bump.outputs.version_name }}"
          # Locate and place setup installer at root if created in build dir
          $setupExe = Get-ChildItem -Path @("windows\build", "build") -Filter "*Exalere-Windows-Setup-x64*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setupExe) {
            Move-Item $setupExe.FullName ".\Exalere-Windows-Setup-x64-$ver.exe" -Force
          }

      - name: Sign Windows Setup Installer (Authenticode)
        shell: pwsh
        run: |
          $ver = "${{ needs.version_bump.outputs.version_name }}"
          $installerPath = ".\Exalere-Windows-Setup-x64-$ver.exe"
          if (Test-Path $installerPath) {
            .\scripts\sign_windows.ps1 -TargetPath $installerPath
          }

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-portable-release
          path: Exalere-Windows-Portable-x64-${{ needs.version_bump.outputs.version_name }}.zip

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-setup-release
          path: Exalere-Windows-Setup-x64-${{ needs.version_bump.outputs.version_name }}.exe

  publish_release:
    name: Publish Release & Assets
    needs: [verify_code, version_bump, build_android, build_windows]
    if: >-
      !cancelled() &&
      needs.verify_code.result == 'success' &&
      needs.version_bump.result == 'success' &&
      (needs.build_android.result == 'success' || needs.build_android.result == 'skipped') &&
      (needs.build_windows.result == 'success' || needs.build_windows.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Commit Version Bump & Create Git Tag
        if: "${{ github.event_name == 'workflow_dispatch' }}"
        run: |
          NEW_VERSION="${{ needs.version_bump.outputs.new_version }}"
          VERSION_NAME="${{ needs.version_bump.outputs.version_name }}"
          TAG="${{ needs.version_bump.outputs.tag_name }}"

          # Update pubspec.yaml
          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml

          # Update Windows Inno Setup installer script
          sed -i "s/#define MyAppVersion .*/#define MyAppVersion \"$VERSION_NAME\"/" windows/installer/exalere_setup.iss

          # Update SVG repo card badge version automatically
          if [ -f ".github/assets/repo-card.svg" ]; then
            sed -i "s/>v[0-9]*\.[0-9]*\.[0-9]*</>v$VERSION_NAME</" .github/assets/repo-card.svg
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml windows/installer/exalere_setup.iss .github/assets/repo-card.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump version to $NEW_VERSION [skip ci]"
          fi
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "Release $TAG"
          fi
          git push origin HEAD:${{ github.ref_name }} --tags

      - name: Download Built Artifacts
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          path: release_assets/

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version_bump.outputs.tag_name }}
          name: "Exalere ${{ needs.version_bump.outputs.tag_name }}"
          body: |
            ## Exalere Release ${{ needs.version_bump.outputs.tag_name }}

            ${{ github.event.inputs.release_notes || 'Exciting new enhancements, bug fixes, and performance updates across all supported platforms.' }}

            ---

            ### 📦 Download Packages by Architecture & Platform:

            | Target Platform / Architecture | Package Asset | Approx. Size | Best For / Description |
            | :--- | :--- | :--- | :--- |
            | 📱 / 📺 **ARM64 (64-bit)** | `Exalere-Android-arm64-v8a-${{ needs.version_bump.outputs.version_name }}.apk` | **~29 MB** | **Recommended:** Most modern Android phones, tablets, Android TV & Google TV devices (Chromecast 4K, Nvidia Shield, Sony Bravia) |
            | 🔥 / 📺 **ARMv7 (32-bit)** | `Exalere-Android-armeabi-v7a-${{ needs.version_bump.outputs.version_name }}.apk` | **~26 MB** | Amazon Fire TV Stick (all generations), budget TV boxes, and older 32-bit Android devices |
            | 💻 **x86_64 (64-bit)** | `Exalere-Android-x86_64-${{ needs.version_bump.outputs.version_name }}.apk` | **~31 MB** | Android emulators (Bluestacks, WSA), x86 tablets, and Intel/AMD Chromebooks |
            | 📦 **Universal Fallback** | `Exalere-Android-Universal-${{ needs.version_bump.outputs.version_name }}.apk` | ~100 MB | All-in-one package bundling all CPU architectures (use if unsure of architecture) |
            | 🪟 **Windows Installer (Setup)** | `Exalere-Windows-Setup-x64-${{ needs.version_bump.outputs.version_name }}.exe` | **~26 MB** | Standard Windows 10/11 Installation wizard with desktop & start menu shortcuts |
            | 🪟 **Windows Portable (.zip)** | `Exalere-Windows-Portable-x64-${{ needs.version_bump.outputs.version_name }}.zip` | **~36 MB** | Standalone portable 64-bit Windows executable & runtime (no install required) |

            ---
            *Built automatically via GitHub Actions CI/CD after 100% build verification.*
          files: release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
