name: Provider self-test

# Runs the headless provider self-test (Catalog / Search / Metadata / Streams
# through createPlugin) against every provider on the Verified list. It fails
# when a provider resolves no stream, which is the rule the Verified badge
# promises. A red run means a site died or changed: withdraw the badge with
# lib/services/verified_providers.dart and regenerate docs/vega-porting-status.md.
on:
  workflow_dispatch:
    inputs:
      providers:
        description: 'Comma-separated provider ids, or "all"'
        required: false
        default: all
      query:
        description: 'Override the search query (optional)'
        required: false
        default: ''
  schedule:
    # Daily, 03:10 UTC — catches a dead mirror before users do.
    - cron: '10 3 * * *'

jobs:
  selftest:
    name: Resolve a stream from every verified provider
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # Cloud runners sit behind different IPs than a home connection, so a
      # Cloudflare-hosted provider can answer 403 there while playing locally
      # (KickAssAnime and AnimeWorld do). The job therefore reports instead of
      # gating: a red list is a signal to re-check locally, not proof of death.
      - name: Run provider self-test
        continue-on-error: true
        env:
          PROVIDERS: ${{ github.event.inputs.providers || 'all' }}
          QUERY: ${{ github.event.inputs.query }}
        run: |
          set -o pipefail
          flutter test test/provider_selftest_test.dart \
            --reporter expanded \
            --dart-define=PROVIDERS="$PROVIDERS" \
            ${QUERY:+--dart-define=QUERY="$QUERY"} \
            2>&1 | tee selftest.log

      - name: Concurrency pass (all at once)
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test test/provider_concurrency_test.dart \
            --reporter expanded \
            --dart-define=CONCURRENT=true \
            2>&1 | tee concurrency.log

      - name: Check the porting ledger is current
        run: |
          python scripts/vega_status.py
          git diff --exit-code docs/vega-porting-status.md \
            || { echo "docs/vega-porting-status.md is stale: commit the regenerated file"; exit 1; }

      - name: Summarise results
        if: always()
        run: |
          plays=$(grep -c 'verdict : PLAYS' selftest.log || true)
          misses=$(grep -c 'verdict : NO STREAM' selftest.log || true)
          {
            echo "## Provider self-test"
            echo ''
            echo "**${plays} resolved a stream · ${misses} did not.**"
            echo ''
            echo "A provider missing here may be geo-blocked on cloud runners"
            echo "(Cloudflare) rather than dead — re-run it locally with"
            echo '\`flutter test test/provider_selftest_test.dart --dart-define=PROVIDERS=<id>\`'
            echo 'before withdrawing its badge.'
            echo ''
            echo '```'
            grep -E '^[a-zA-Z0-9_]+( \(verified\))?$|^  (catalog|search|metadata|streams|verdict) ' selftest.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-selftest-log
          path: |
            selftest.log
            concurrency.log
          retention-days: 14
